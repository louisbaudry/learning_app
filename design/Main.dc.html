<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Atkinson Hyperlegible', Verdana, sans-serif; color: #2A2620; }
    a { color: #17707F; } a:hover { color: #0F5560; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F1; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 64px 24px 20px 24px; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-family: 'Nunito', Verdana, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.2;">Bonjour Arthur&nbsp;!</div>
    <div style="font-size: 18px; color: #6B645A;">Jeudi 21 août</div>
  </div>

  <div style="margin: 0 24px 20px 24px; background: #FFFFFF; border: 2px solid #E8E2D8; border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 12px;">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D97A2B" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 5.9 6.5 0.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-0.9z"></path></svg>
    <div style="font-size: 18px; font-weight: 700;">3 jours d'affilée&nbsp;— continue&nbsp;!</div>
  </div>

  <div style="padding: 0 24px 12px 24px; font-family: 'Nunito', Verdana, sans-serif; font-weight: 800; font-size: 20px; color: #6B645A;">Tes devoirs</div>

  <div style="flex-grow: 1; padding: 0 24px; display: flex; flex-direction: column; gap: 16px;">

    <div style="background: #FFFFFF; border: 2px solid #17707F; border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 14px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
        <div style="align-self: flex-start; background: #E3F0F2; color: #17707F; font-weight: 700; font-size: 15px; padding: 4px 12px; border-radius: 999px;">Maths</div>
        <div style="font-size: 22px; font-weight: 700; line-height: 1.25;">Les pièces en euros</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="background: #D97A2B; color: #FFFFFF; font-weight: 700; font-size: 15px; padding: 3px 10px; border-radius: 999px;">Nouveau</div>
          <div style="font-size: 16px; color: #6B645A;">5 questions</div>
        </div>
      </div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#17707F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>

    <div style="background: #FFFFFF; border: 2px solid #D8D2C7; border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 14px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
        <div style="align-self: flex-start; background: #F7E8D8; color: #A85F1E; font-weight: 700; font-size: 15px; padding: 4px 12px; border-radius: 999px;">Découverte</div>
        <div style="font-size: 22px; font-weight: 700; line-height: 1.25;">Les animaux de la ferme</div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 120px; height: 10px; background: #EDE8DF; border-radius: 999px; overflow: hidden;"><div style="width: 40%; height: 10px; background: #17707F; border-radius: 999px;"></div></div>
          <div style="font-size: 16px; color: #6B645A; font-weight: 700;">2 sur 5</div>
        </div>
      </div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9A9184" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>

    <div style="background: #F3EFE7; border: 2px solid #E8E2D8; border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 14px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
        <div style="align-self: flex-start; background: #F0EDE6; color: #6B645A; font-weight: 700; font-size: 15px; padding: 4px 12px; border-radius: 999px;">Lecture</div>
        <div style="font-size: 22px; font-weight: 700; line-height: 1.25; color: #6B645A;">Les mots de la cuisine</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"></path></svg>
          <div style="font-size: 16px; color: #2E7D46; font-weight: 700;">Terminé — 4 sur 5</div>
        </div>
      </div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9C2B6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>

  </div>

  <div style="height: 84px; background: #FFFFFF; border-top: 2px solid #E8E2D8; display: flex; align-items: stretch;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#17707F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5l9-7 9 7"></path><path d="M5 9.5v10h14v-10"></path></svg>
      <div style="font-size: 16px; font-weight: 700; color: #17707F;">Accueil</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9A9184" stroke-width="2.2" stroke-linecap="round"><path d="M5 19V12"></path><path d="M12 19V6"></path><path d="M19 19v-9"></path></svg>
      <div style="font-size: 16px; font-weight: 700; color: #6B645A;">Mes progrès</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
